name: Release tagged version

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release-version.py "${RELEASE_TAG}"

      - name: Run project checks
        run: ./scripts/check-skill.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Dispatch PyPI publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW_REF: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run publish-pypi.yml \
            --ref "${PUBLISH_WORKFLOW_REF}" \
            --field release_tag="${RELEASE_TAG}"
