name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run skill checks
        shell: bash
        run: ./scripts/check-skill.sh

      - name: Validate distributable Agent Skill
        if: matrix.python-version == '3.12'
        shell: bash
        run: gh skill publish --dry-run "${GITHUB_WORKSPACE}/skills"

      - name: Verify non-editable CLI install
        shell: bash
        run: |
          python -m pip install .
          app-store-review-risk --help

  action-smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run the local composite action
        uses: ./
        with:
          path: examples/demo-app
          fail-on: none
